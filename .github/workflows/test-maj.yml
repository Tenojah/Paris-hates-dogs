name: Test mise à jour (simulation, ne publie rien)
on:
  push:
    branches: [maj-auto-donnees]
    paths: [".github/workflows/test-maj.yml", "scripts/update_data.py"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lancer le script sur les vraies données
        run: |
          python scripts/update_data.py > /dev/null || echo "ECHEC DU SCRIPT"
          echo "=== RAPPORT ==="; cat rapport.md | head -400
